name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22', '24']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Format check
        run: npm run format:check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  package:
    name: Verify published contents
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Confirm the tarball carries the built entrypoint
        run: |
          npm pack --dry-run --json > pack.json
          node -e "
            const files = JSON.parse(require('fs').readFileSync('pack.json','utf8'))[0].files.map(f => f.path);
            const required = ['dist/index.js', 'package.json', 'README.md', 'LICENSE'];
            const missing = required.filter(f => !files.includes(f));
            if (missing.length) { console.error('Missing from tarball:', missing); process.exit(1); }
            const leaked = files.filter(f => f.startsWith('test/') || f.endsWith('.env'));
            if (leaked.length) { console.error('Unexpected files in tarball:', leaked); process.exit(1); }
            console.log('Tarball contents OK (' + files.length + ' files)');
          "
